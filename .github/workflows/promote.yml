name: Promote verified release
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful trusted staging run ID
        type: string
        required: true
      version:
        description: Production version such as v0.1.0
        type: string
        required: true
      notes:
        description: Short release notes
        type: string
        required: true
      recovery:
        description: Recovery evidence JSON from the release runbook
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  RELEASE_ENVIRONMENTS: ${{ vars.RELEASE_ENVIRONMENTS }}
concurrency:
  group: damadama-production
  queue: max
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      hash: ${{ steps.plan.outputs.hash }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node controls/release/supply-install.mjs verifier
      - id: plan
        run: node controls/release/operate.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RECOVERY_EVIDENCE: ${{ inputs.recovery }}
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-plan-${{ github.run_attempt }}
          path: |
            promotion-plan.json
            migrations.sql
          retention-days: 90
          if-no-files-found: error
  promote:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_ORIGIN }}
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --prefix controls/release
      - run: node controls/release/supply-install.mjs verifier
      - run: node controls/release/operate.mjs promote
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_HASH: ${{ needs.preflight.outputs.hash }}
          PLAN_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RECOVERY_EVIDENCE: ${{ inputs.recovery }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_DEPLOYMENT_IMAGE_PATH: ${{ vars.RAILWAY_DEPLOYMENT_IMAGE_PATH }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: production-failure-${{ github.run_attempt }}
          path: runtime-evidence
          retention-days: 3
