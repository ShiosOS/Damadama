name: Check
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: bun .github/ci/workflow-lint.mjs
      - run: bun .github/ci/workflow-lint.mjs --self-test
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - id: application
        run: |
          state=$(node release/application.mjs "$(git rev-parse HEAD)")
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - if: steps.application.outputs.state == 'setup'
        run: echo "Nondeployable setup. No application has existed since the approved controls baseline." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.application.outputs.state == 'application'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.112
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json
      - if: steps.application.outputs.state == 'application'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: steps.application.outputs.state == 'application'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - if: steps.application.outputs.state == 'application'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - if: steps.application.outputs.state == 'application'
        run: bun install --frozen-lockfile
      - if: steps.application.outputs.state == 'application'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.application.outputs.state == 'application'
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - if: steps.application.outputs.state == 'application'
        run: bun run check
      - if: steps.application.outputs.state == 'application'
        name: AppHost and EF compatibility
        timeout-minutes: 5
        run: bash .github/ci/apphost-proof.sh
      - id: failure-reports
        if: always() && steps.application.outputs.state == 'application'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            .audit/TestResults/**/*.trx
            .audit/api-contract/openapi.json
            .audit/api-contract/responses.json
            .audit/api-contract/negative-controls/*.json
            .audit/performance-assets.json
            .audit/performance-browser.json
            .audit/performance-saved.png
            .audit/accessibility-*.json
            .audit/accessibility-*.png
            .audit/today-*.png
            .audit/today-*.webm
            .audit/entries-*.png
            .audit/entries-*.webm
            test-results/**/*.png
            test-results/**/error-context.md
            tests/Browser/playwright-report
            !**/fixture.json
            !**/*token*
            !**/.env*
            !**/storage-state*.json
            !**/.auth/**
            !**/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  diagnostics-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        workflow: [check, stage]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - id: policy
        run: bun .github/diagnostics/artifact-policy.mjs prepare "${WORKFLOW}" "${RUNNER_TEMP}/diagnostics/source"
        env:
          WORKFLOW: ${{ matrix.workflow }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-policy-${{ matrix.workflow }}-${{ github.run_attempt }}
          path: ${{ steps.policy.outputs.path }}
          include-hidden-files: ${{ steps.policy.outputs.include_hidden_files }}
          retention-days: ${{ steps.policy.outputs.retention_days }}
          if-no-files-found: error
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: diagnostics-policy-${{ matrix.workflow }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostics/download
      - run: bun .github/diagnostics/artifact-policy.mjs verify "${WORKFLOW}" "${RUNNER_TEMP}/diagnostics/download"
        env:
          WORKFLOW: ${{ matrix.workflow }}
  check:
    needs: [application, diagnostics-policy, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node .github/ci/required-jobs.mjs check
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
