name: Check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.112
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: |
          mkdir -p .audit
          {
            date -u --iso-8601=ns
            ip -details link show
            ip -details address show
            ip route show table all
            ip -6 route show table all
          } > .audit/network-initial.log 2>&1
          docker events --format '{{json .}}' > .audit/docker-events.jsonl 2> .audit/docker-events-error.log &
          TZ=UTC ip -ts monitor link address route > .audit/network-events.log 2>&1 &
          bun run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-reports
          path: |
            .audit/TestResults
            test-results
            playwright-report
            .audit/network-initial.log
            .audit/docker-events.jsonl
            .audit/docker-events-error.log
            .audit/network-events.log
          retention-days: 3
