name: Railway tracing proof
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: railway-tracing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tracing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: telemetry_proof
          POSTGRES_USER: telemetry_proof
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetry_proof -d telemetry_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.112
      - run: dotnet restore tests/TelemetryProof/TelemetryProof.csproj --locked-mode
      - run: dotnet format server/Damadama.csproj --no-restore --verify-no-changes
      - run: dotnet format tests/TelemetryProof/TelemetryProof.csproj --no-restore --verify-no-changes
      - run: dotnet run --project tests/TelemetryProof/TelemetryProof.csproj --no-restore
        env:
          TELEMETRY_POSTGRES: Host=localhost;Port=5432;Database=telemetry_proof;Username=telemetry_proof;Password=${{ github.run_id }}-${{ github.run_attempt }}
