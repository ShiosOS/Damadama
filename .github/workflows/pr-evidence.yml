name: PR evidence
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const body = context.payload.pull_request.body ?? "";
            function metadataFailure(markdown) {
              const sections = new Map();
              let current;
              let fence;
              const visible = markdown.replace(/<!--[\s\S]*?(?:-->|$)/g, "");
              for (const line of visible.split(/\r?\n/)) {
                if (fence) {
                  current?.content.push(line);
                  const closing = line.match(/^ {0,3}(`+|~+)[ \t]*$/)?.[1];
                  if (closing?.[0] === fence[0] && closing.length >= fence.length) fence = undefined;
                  continue;
                }
                const opening = line.match(/^ {0,3}(`{3,}|~{3,})[^\r\n]*$/)?.[1];
                if (opening) {
                  fence = opening;
                  current?.content.push(line);
                  continue;
                }
                const heading = line.match(/^ {0,3}(#{1,6})[ \t]+(.+?)[ \t]*$/);
                if (heading && heading[1].length <= 2) {
                  current = undefined;
                  if (heading[1].length === 2) {
                    const title = heading[2].replace(/[ \t]+#+[ \t]*$/, "");
                    current = { content: [], prose: [] };
                    const copies = sections.get(title) ?? [];
                    copies.push(current);
                    sections.set(title, copies);
                  }
                  continue;
                }
                current?.content.push(line);
                if (!/^(?: {4}|\t)/.test(line)) current?.prose.push(line);
              }
              function meaningful(lines) {
                const text = lines.join("\n")
                  .replace(/^ {0,3}(?:`{3,}|~{3,})[^\r\n]*$/gm, "")
                  .replace(/^ {0,3}#{1,6}[ \t]+[^\r\n]*$/gm, "")
                  .replace(/<[^>]*>/g, "")
                  .replace(/[`*_#[\]>-]/g, "")
                  .trim();
                return /[\p{L}\p{N}]/u.test(text) &&
                  !/^(?:TODO|TBD|Describe the problem and who the change helps\.|State what this PR includes and any deferred work\.|List the commands you ran and their results\. Link the actual output in a CI run or PR attachment\.)$/i.test(text);
              }
              const requirements = sections.get("Requirements") ?? [];
              if (requirements.length !== 1) return "Use exactly one ## Requirements section.";
              const prose = requirements[0].prose.join("\n");
              const stories = [...prose.matchAll(/^ {0,3}Story:[ \t]*(.*)$/gm)];
              if (stories.length !== 1 || !/^https:\/\/app\.notion\.com\/p\/[0-9a-f]{32}$/.test(stories[0][1].trim())) {
                return "Add exactly one Story field under ## Requirements with a canonical https://app.notion.com/p/<32-character-page-id> URL.";
              }
              const outcomes = [...prose.matchAll(/^ {0,3}Outcome:[ \t]*(.*)$/gm)];
              if (outcomes.length !== 1 || !meaningful([outcomes[0][1]])) {
                return "Add exactly one nonblank Outcome field under ## Requirements. Replace template prompts with the intended result.";
              }
              for (const heading of ["Scope", "Acceptance examples", "Verification"]) {
                const copies = sections.get(heading) ?? [];
                if (copies.length !== 1) return `Use exactly one ## ${heading} section.`;
                if (!meaningful(copies[0].content)) return `Fill ## ${heading} with the PR's actual ${heading.toLowerCase()}. Replace template prompts.`;
              }
              if ((sections.get("Evidence") ?? []).length !== 1) return "Use exactly one ## Evidence section.";
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const evidence = body.split(/^## Evidence[ \t]*\r?$/m)[1]?.split(/^##[ \t]/m)[0] ?? "";
            const screenshots = evidence.split(/^### Screenshots[ \t]*\r?$/m)[1]?.split(/^###?[ \t]/m)[0] ?? "";
            const recording = evidence.split(/^### Screen recording[ \t]*\r?$/m)[1]?.split(/^###?[ \t]/m)[0] ?? "";
            const hasLink = /https:\/\/[^\s<>()]+/.test(evidence);
            const screenshotImages = [...screenshots.matchAll(/!\[[^\]]*\]\((https:\/\/[^\s)]+)\)/g)];
            const artifactImage = [...screenshots.matchAll(/!\[[^\]]*\]\(\s*<?(https:\/\/[^\s>)]+)/gi)].some(match => {
              const url = URL.parse(match[1]);
              return url?.hostname === "github.com" && /^\/[^/]+\/[^/]+\/actions\/(?:runs\/[^/]+\/)?artifacts\//i.test(url.pathname);
            });
            const screenshotDownload = screenshots.split(/\r?\n[ \t]*\r?\n/).some(paragraph => {
              if (!/`(?:[a-z0-9_-][a-z0-9._-]*\/)*[a-z0-9_-][a-z0-9._-]*\.png`/i.test(paragraph)) return false;
              return [...paragraph.matchAll(/(?<!!)\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g)].some(([, label, link]) => {
                const artifact = link.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/actions\/runs\/[1-9][0-9]*\/artifacts\/[1-9][0-9]*$/);
                return /^Download(?:\s|$)/i.test(label.trim()) && artifact &&
                  artifact[1].toLowerCase() === context.repo.owner.toLowerCase() &&
                  artifact[2].toLowerCase() === context.repo.repo.toLowerCase();
              });
            });
            const hasScreenshot = screenshotImages.length > 0 || screenshotDownload;
            const hasRecording = /https:\/\/[^\s<>()]+/.test(recording);
            const isVisual = files.some(file => file.filename.startsWith("web/") || file.previous_filename?.startsWith("web/"));
            const explained = /Visual evidence does not apply because [^\r\n]+/i.test(evidence);
            const testedRevision = evidence.match(/^Tested revision:[ \t]+([0-9a-f]{40})[ \t]*\r?$/im)?.[1];
            const generated = files.find(file => file.status !== "removed" && (
              /^(?:docs|\.github)\/evidence\/.*\.(?:png|jpg|jpeg|gif|webp|mp4|webm|mov|log|txt|trx|html|zip)$/i.test(file.filename) ||
              /(?:^|\/)(?:\.audit|test-results|playwright-report)\//i.test(file.filename)
            ));
            const mediaLinks = [
              ...screenshots.matchAll(/(https:\/\/[^\s<>()]+)/g),
              ...recording.matchAll(/(https:\/\/[^\s<>()]+)/g),
            ].map(match => match[1]);
            const repositoryMedia = mediaLinks.some(link => {
              const url = URL.parse(link);
              return url && (
                ["raw.githubusercontent.com", "raw.github.com"].includes(url.hostname) ||
                (url.hostname === "github.com" && /^\/[^/]+\/[^/]+\/(?:blob|raw)\//i.test(url.pathname))
              );
            });
            if (!evidence.trim() || !hasLink) {
              core.setFailed("Add an ## Evidence section with an HTTPS link to actual verification output.");
            } else if (artifactImage) {
              core.setFailed("Do not embed GitHub Actions artifact bundles as images. Use an ordinary [Download screenshots](https://github.com/<owner>/<repo>/actions/runs/123/artifacts/456) link and name relative PNG paths in code spans in the same paragraph.");
            } else if (isVisual && (!hasScreenshot || !hasRecording)) {
              core.setFailed("UI changes require an HTTPS Markdown image or a same-repository Actions screenshot download under ### Screenshots, and an HTTPS recording link under ### Screen recording. Example: [Download screenshots](https://github.com/<owner>/<repo>/actions/runs/123/artifacts/456) containing `desktop.png` in the same paragraph.");
            } else if (!isVisual && !(hasScreenshot && hasRecording) && !explained) {
              core.setFailed("Include screenshots and a recording, or explain 'Visual evidence does not apply because ...' and link actual verification output.");
            } else if (!testedRevision || testedRevision.toLowerCase() !== context.payload.pull_request.head.sha.toLowerCase()) {
              core.setFailed("Include 'Tested revision: <full 40-character SHA>' in ## Evidence matching the current PR head. Update it after testing each push.");
            } else if (generated) {
              core.setFailed(`Move generated verification output out of Git and link PR attachments or CI artifacts instead: ${generated.filename}`);
            } else if (repositoryMedia) {
              core.setFailed("Use PR attachments or CI artifacts for screenshot and recording evidence, not repository blob or raw URLs.");
            } else {
              const failure = metadataFailure(body);
              if (failure) core.setFailed(failure);
              else core.notice("PR metadata format passed. Linked-story contents and semantic focus remain unverified.");
            }
