name: Main staging
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
env:
  RELEASE_ENVIRONMENTS: ${{ vars.RELEASE_ENVIRONMENTS }}
concurrency:
  group: damadama-staging
  queue: max
  cancel-in-progress: false
jobs:
  release-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test release/*.test.mjs
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      state: ${{ steps.source.outputs.state }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controls
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - id: source
        run: node controls/release/operate.mjs snapshot
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.source.outputs.state == 'application'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ github.run_attempt }}
          path: |
            source.json
            candidate.json
          retention-days: 90
          if-no-files-found: error
  check:
    needs: source
    if: needs.source.outputs.state == 'application'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.112
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run check
      - id: failure-reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: failure-reports-${{ github.run_attempt }}
          path: |
            .audit/TestResults/**/*.trx
            .audit/performance-assets.json
            .audit/performance-browser.json
            .audit/performance-saved.png
            .audit/accessibility-*.json
            .audit/accessibility-*.png
            .audit/today-*.png
            .audit/today-*.webm
            test-results/**/*.png
            test-results/**/error-context.md
            tests/Browser/playwright-report
            !**/fixture.json
            !**/*token*
            !**/.env*
            !**/storage-state*.json
            !**/.auth/**
            !**/*.zip
          include-hidden-files: true
          retention-days: 3
  build:
    needs: [source, release-controls, check]
    if: needs.source.outputs.state == 'application'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-${{ github.run_attempt }}
      - run: node controls/release/package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-image-${{ github.run_attempt }}
          path: image.tar
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-metadata-${{ github.run_attempt }}
          path: |
            build.json
            migrations.sql
          retention-days: 90
          if-no-files-found: error
  stage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.APP_ORIGIN }}
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: controls/release/package-lock.json
      - run: npm ci --ignore-scripts --prefix controls/release
      - run: node controls/release/node_modules/@playwright/test/cli.js install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-${{ github.run_attempt }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-image-${{ github.run_attempt }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-metadata-${{ github.run_attempt }}
      - run: node controls/release/operate.mjs stage
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_DEPLOYMENT_IMAGE_PATH: ${{ vars.RAILWAY_DEPLOYMENT_IMAGE_PATH }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_TEST_USER_A: ${{ vars.CLERK_TEST_USER_A }}
          CLERK_TEST_USER_B: ${{ vars.CLERK_TEST_USER_B }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-record-${{ github.run_attempt }}
          path: verified.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-evidence-${{ github.run_attempt }}
          path: runtime-evidence
          retention-days: 3
