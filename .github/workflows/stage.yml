name: Main staging
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
env:
  RELEASE_ENVIRONMENTS: ${{ vars.RELEASE_ENVIRONMENTS }}
concurrency:
  group: damadama-staging
  queue: max
  cancel-in-progress: false
jobs:
  security-codeql:
    uses: $/.github/workflows/security-codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  security-dependencies:
    uses: $/.github/workflows/security-dependencies.yml
    permissions:
      contents: read
      pull-requests: read
  release-controls:
    needs: [security-codeql, security-dependencies]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node --test release/*.test.mjs
      - run: node .github/ci/required-jobs.mjs main-release-controls
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      state: ${{ steps.source.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - id: source
        run: node controls/release/operate.mjs snapshot
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.source.outputs.state == 'application'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-${{ github.run_attempt }}
          path: |
            source.json
            candidate.json
          retention-days: 90
          if-no-files-found: error
  check:
    needs: source
    if: needs.source.outputs.state == 'application'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.112
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.*.lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun .github/ci/workflow-lint.mjs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run check
      - id: failure-reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: failure-reports-${{ github.run_attempt }}
          path: |
            .audit/TestResults/**/*.trx
            .audit/api-contract/openapi.json
            .audit/api-contract/responses.json
            .audit/api-contract/negative-controls/*.json
            .audit/performance-assets.json
            .audit/performance-browser.json
            .audit/performance-saved.png
            .audit/accessibility-*.json
            .audit/accessibility-*.png
            .audit/today-*.png
            .audit/today-*.webm
            .audit/entries-*.png
            .audit/entries-*.webm
            test-results/**/*.png
            test-results/**/error-context.md
            tests/Browser/playwright-report
            !**/fixture.json
            !**/*token*
            !**/.env*
            !**/storage-state*.json
            !**/.auth/**
            !**/*.zip
          include-hidden-files: true
          retention-days: 3
  build:
    needs: [source, release-controls, check]
    if: needs.source.outputs.state == 'application'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-${{ github.run_attempt }}
      - run: node controls/release/package.mjs
      - id: paths
        run: node controls/release/supply-release.mjs upload-paths . build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supply-build-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-metadata-${{ github.run_attempt }}
          path: |
            build.json
            migrations.sql
          retention-days: 90
          if-no-files-found: error
  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-${{ github.run_attempt }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: supply-build-${{ github.run_attempt }}
          path: supply-build
      - run: node controls/release/supply-install.mjs scanner
      - run: |
          node --input-type=module <<'SCAN'
          import { readFile } from 'node:fs/promises';
          import { scanArchive } from './controls/release/supply-chain.mjs';
          const { source, authority } = JSON.parse(await readFile('candidate.json', 'utf8'));
          const build = JSON.parse(await readFile('supply-build/build.json', 'utf8'));
          await scanArchive({ source, authority, build, archivePath: 'supply-build/image.tar', frontendBuildDirectory: 'supply-build', evidenceDirectory: 'supply-scan' });
          SCAN
      - id: paths
        run: node controls/release/supply-release.mjs upload-paths supply-scan scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supply-scan-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-${{ github.run_attempt }}
      - run: node controls/release/supply-install.mjs signer
      - run: node controls/release/supply-release.mjs publish supply-published
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - id: paths
        run: node controls/release/supply-release.mjs upload-paths supply-published publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-image-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          retention-days: 3
          if-no-files-found: error
  sign:
    needs: [build, scan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-${{ github.run_attempt }}
      - run: node controls/release/supply-install.mjs signer
      - id: prepare
        run: node controls/release/supply-release.mjs prepare supply-signed
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/shiosos/damadama
          subject-digest: ${{ steps.prepare.outputs.digest }}
          push-to-registry: false
          create-storage-record: false
      - id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/shiosos/damadama
          subject-digest: ${{ steps.prepare.outputs.digest }}
          sbom-path: supply-signed/scan/sbom.spdx.json
          push-to-registry: false
          create-storage-record: false
      - run: |
          cp "$PROVENANCE" supply-signed/signer/provenance.bundle.json
          cp "$SBOM" supply-signed/signer/sbom.bundle.json
          node controls/release/supply-release.mjs assemble supply-signed
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - id: manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: supply-signed/manifest.json
          push-to-registry: false
          create-storage-record: false
      - run: cp "$BUNDLE" supply-signed/manifest.bundle.json
        env:
          BUNDLE: ${{ steps.manifest.outputs.bundle-path }}
      - id: paths
        run: node controls/release/supply-release.mjs upload-paths supply-signed release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supply-release-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          retention-days: 3
          if-no-files-found: error
  verify:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-${{ github.run_attempt }}
      - run: node controls/release/supply-install.mjs verifier
      - run: node controls/release/supply-release.mjs verify supply-verification
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
  stage:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.APP_ORIGIN }}
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: controls/release/package-lock.json
      - run: npm ci --ignore-scripts --prefix controls/release
      - run: node controls/release/node_modules/@playwright/test/cli.js install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-${{ github.run_attempt }}
      - run: node controls/release/supply-install.mjs verifier
      - run: node controls/release/operate.mjs stage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_DEPLOYMENT_IMAGE_PATH: ${{ vars.RAILWAY_DEPLOYMENT_IMAGE_PATH }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_TEST_USER_A: ${{ vars.CLERK_TEST_USER_A }}
          CLERK_TEST_USER_B: ${{ vars.CLERK_TEST_USER_B }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-record-${{ github.run_attempt }}
          path: verified.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: runtime-evidence-${{ github.run_attempt }}
          path: runtime-evidence
          retention-days: 3
