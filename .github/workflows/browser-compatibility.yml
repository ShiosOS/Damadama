name: Independent shipping driver

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact application commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: independent-shipping-driver-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate source revision
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Record exact source and controls
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git('rev-parse', 'HEAD'), process.env.SOURCE_SHA);
          assert.equal(git('status', '--porcelain', '--untracked-files=no'), '');
          mkdirSync('.audit/independent-shipping-driver', { recursive: true });
          writeFileSync('.audit/independent-shipping-driver/source.json', JSON.stringify({
            source: git('rev-parse', 'HEAD'),
            tree: git('rev-parse', 'HEAD^{tree}'),
            controls: process.env.CONTROLS_SHA,
            run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            platform: process.platform,
            node: process.version,
            trackedInputsClean: true
          }, null, 2) + '\n');
          NODE
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROLS_SHA: ${{ github.workflow_sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Independent production API and PostgreSQL drive
        timeout-minutes: 12
        run: bun run test:backend
      - name: Strict receiver consumers on fresh backend bytes
        run: node --test ops/diagnostics/receiver.test.mjs ops/diagnostics/receiver-handshake.test.mjs
      - name: Validate fresh production API contract
        run: node scripts/api-contract.mjs
      - name: Independent integrated browser drive
        timeout-minutes: 12
        run: bun run test:browser
      - name: Independent complete native drive
        timeout-minutes: 7
        run: node .agents/skills/verify/native-session.mjs
        env:
          VERIFICATION_PR_HEAD: ${{ inputs.source_sha }}
      - name: Retain sanitized source and application proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: independent-shipping-driver-${{ inputs.source_sha }}-${{ github.run_id }}
          path: |
            .audit/independent-shipping-driver/source.json
            .audit/TestResults/backend.trx
            .audit/api-contract/responses.json
            .audit/verification-skill/retained/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
