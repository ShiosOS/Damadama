name: APT payload diagnostic experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-payload-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apt-payload-probe:
    name: APT payload probe (${{ matrix.worker }})
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        worker: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/diagnostics/apt-batch-probe.py
          sparse-checkout-cone-mode: false
      - name: Compare exact Playwright dependency batches without installing
        timeout-minutes: 6
        env:
          PROBE_WORKER: ${{ matrix.worker }}
        run: python3 .github/diagnostics/apt-batch-probe.py
      - name: Retain only the sanitized diagnostic receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apt-payload-probe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.worker }}
          path: apt-payload-probe.json
          if-no-files-found: error
          retention-days: 7
