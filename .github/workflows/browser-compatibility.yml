name: Windows cleanup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 2de3bd3864b5bbbf17fdd4798fdc06c927e68c59
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: source/global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
        working-directory: source
      - run: bun audit-controls/windows-capture-diagnostic.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-cleanup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            proof/source.json
            proof/runtime-after.json
            proof/original-result.json
            proof/original-processes.jsonl
            proof/original-monitor.json
            proof/original-monitor-summary.json
            proof/instrumented-result.json
            proof/instrumented-processes.jsonl
            proof/instrumented-monitor.json
            proof/instrumented-monitor-summary.json
            proof/captures.jsonl
            proof/instrumentation.diff
          if-no-files-found: error
          retention-days: 7
