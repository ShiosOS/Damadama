name: Supply chain proof

on:
  push:
    branches: [codex/polish-image-supply-chain]

permissions:
  contents: read

concurrency:
  group: supply-chain-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  origin-probe:
    name: origin-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - run: node --test release/supply-origin-probe.test.mjs
      - run: node release/supply-origin-probe.mjs .audit/origin-probe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-origin-probe-${{ github.run_attempt }}
          path: .audit/origin-probe
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  proof-build:
    name: proof-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - run: node --test release/*.test.mjs
      - run: node release/supply-proof.mjs build .audit/proof-build
      - id: paths
        if: always()
        run: node release/supply-proof.mjs upload-paths build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-proof-build-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  proof-scan:
    name: proof-scan
    needs: proof-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: supply-proof-build-${{ github.run_attempt }}
          path: .audit/proof-build
      - run: node release/supply-install.mjs scanner
      - run: node release/supply-proof.mjs scan .audit/proof-build .audit/proof-scan
      - id: paths
        if: always()
        run: node release/supply-proof.mjs upload-paths scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-proof-scan-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  proof-application-scan:
    name: proof-application-scan
    needs: proof-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: supply-proof-build-${{ github.run_attempt }}
          path: .audit/proof-build
      - run: node release/supply-install.mjs scanner
      - run: node release/supply-proof.mjs scan-application .audit/proof-build .audit/proof-application
      - id: paths
        if: always()
        run: node release/supply-proof.mjs upload-paths application-scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-proof-application-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  proof-sign:
    name: proof-sign
    needs: [proof-build, proof-scan, proof-application-scan]
    if: github.event_name == 'push' && github.repository == 'ShiosOS/Damadama' && github.ref == 'refs/heads/codex/polish-image-supply-chain'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # Authenticate producer jobs and immutable artifact ZIPs.
      id-token: write # Issue only the separate proof workflow identity.
      attestations: write # Confined to this isolated proof signer.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - run: node release/supply-install.mjs signer
      - run: node release/supply-proof.mjs prepare .audit/proof-signed
        env:
          GH_TOKEN: ${{ github.token }}
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .audit/proof-signed/build/image.tar
          push-to-registry: false
          create-storage-record: false
      - id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .audit/proof-signed/build/image.tar
          sbom-path: .audit/proof-signed/scan/sbom.spdx.json
          push-to-registry: false
          create-storage-record: false
      - run: |
          cp "$PROVENANCE" .audit/proof-signed/signer/provenance.bundle.json
          cp "$SBOM" .audit/proof-signed/signer/sbom.bundle.json
          node release/supply-proof.mjs assemble .audit/proof-signed
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
      - id: manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: .audit/proof-signed/manifest.json
          push-to-registry: false
          create-storage-record: false
      - run: cp "$BUNDLE" .audit/proof-signed/manifest.bundle.json
        env:
          BUNDLE: ${{ steps.manifest.outputs.bundle-path }}
      - id: paths
        run: node release/supply-proof.mjs upload-paths signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: supply-proof-signed-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  proof-verify:
    name: proof-verify
    needs: proof-sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # Recheck immutable producer artifact membership.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: supply-proof-signed-${{ github.run_attempt }}
          path: .audit/proof-signed
      - run: node release/supply-install.mjs verifier
      - run: node release/supply-proof.mjs prove .audit/proof-signed
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-proof-verification-${{ github.run_attempt }}
          path: .audit/proof-signed
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
