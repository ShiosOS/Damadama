name: Railway platform
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: railway-platform-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  definition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --prefix .railway --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix .railway
      - run: docker build --file .railway/Preview.Dockerfile --tag damadama-preview:${{ github.event.pull_request.head.sha }} .
