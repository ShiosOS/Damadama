name: Developer experience
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: developer-experience-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
jobs:
  prerequisites:
    name: Prerequisites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test scripts/doctor.test.ts scripts/developer.test.ts
      - run: bun run check:types
      - run: bun run format:check
      - if: runner.os == 'Linux'
        run: bun run doctor backend
  focused:
    name: Clean checkout (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [backend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - if: matrix.suite == 'browser'
        run: bun install --frozen-lockfile
      - if: matrix.suite == 'browser'
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run test:${{ matrix.suite }}
        env:
          DAMADAMA_BROWSER_PORT: "5184"
          DAMADAMA_API_PORT: "5065"
