name: Provider session verification
on:
  pull_request:
    paths:
      - tests/Provider/**
      - .github/workflows/provider-smoke.yml
      - release/policy.mjs
      - release/smoke.mjs
      - package.json
      - bun.lock
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full deployed source commit from staging release.json
        required: true
        type: string
permissions:
  contents: read
jobs:
  provider-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test tests/Provider/*.test.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun x --no-install eslint tests/Provider
      - run: bun x --no-install prettier --check tests/Provider .github/workflows/provider-smoke.yml
  provider-session:
    needs: provider-helpers
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ShiosOS/Damadama'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.damadama.app
    concurrency:
      group: damadama-staging
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - id: provider
        run: node tests/Provider/run.mjs
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_TEST_USER_A: ${{ vars.CLERK_TEST_USER_A }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && (steps.provider.outcome == 'success' || steps.provider.outcome == 'failure')
        with:
          name: provider-session-${{ github.run_attempt }}
          path: test-results/provider-smoke.json
          retention-days: 3
          if-no-files-found: error
