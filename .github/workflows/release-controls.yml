name: Release controls
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
concurrency:
  group: release-controls-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  runtime-policy:
    uses: $/.github/workflows/release-runtime-check.yml
    permissions:
      contents: read
  recovery:
    uses: $/.github/workflows/recovery-check.yml
    permissions:
      contents: read
  evidence:
    uses: $/.github/workflows/pr-evidence.yml
    permissions:
      contents: read
      pull-requests: read
  security-codeql:
    uses: $/.github/workflows/security-codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  security-dependencies:
    uses: $/.github/workflows/security-dependencies.yml
    permissions:
      contents: read
      pull-requests: read
  security-fixtures:
    uses: $/.github/workflows/security-fixtures.yml
    permissions:
      contents: read
  browser-compatibility:
    uses: $/.github/workflows/browser-compatibility.yml
    permissions:
      contents: read
  developer-experience:
    uses: $/.github/workflows/developer-experience.yml
    permissions:
      contents: read
  current-image-recovery:
    uses: $/.github/workflows/recovery-current-image.yml
    permissions:
      contents: read
  metadata-publication:
    uses: $/.github/workflows/recovery-metadata-publication.yml
    permissions:
      contents: read
  supply-pr:
    uses: $/.github/workflows/supply-pr-proof.yml
    permissions:
      contents: read
  tracing:
    uses: $/.github/workflows/railway-tracing-check.yml
    permissions:
      contents: read
  preview:
    uses: $/.github/workflows/railway-platform-check.yml
    permissions:
      contents: read
  release-controls:
    needs:
      - runtime-policy
      - recovery
      - evidence
      - security-codeql
      - security-dependencies
      - security-fixtures
      - browser-compatibility
      - developer-experience
      - current-image-recovery
      - metadata-publication
      - supply-pr
      - tracing
      - preview
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node .github/ci/required-jobs.mjs release-controls
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
