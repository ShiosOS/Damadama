name: Compatibility CPU observation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-cpu-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test tests/Browser/visual-support.test.ts
      - run: dotnet restore --locked-mode --artifacts-path .audit/check-build
      - run: dotnet build --no-restore --artifacts-path .audit/check-build
      - run: bun x --no-install vite build --config tests/Browser/compatibility.vite.config.ts
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Observe twenty fresh accounts at normal CPU
        id: normal
        continue-on-error: true
        run: node .github/diagnostics/compatibility-cpu-probe.mjs 1
      - name: Observe twenty fresh accounts at eightfold CPU throttling
        id: throttled
        continue-on-error: true
        run: node .github/diagnostics/compatibility-cpu-probe.mjs 8
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compatibility-cpu-observations-${{ github.sha }}
          path: |
            .audit/compatibility-cpu-probe/rate-1.jsonl
            .audit/compatibility-cpu-probe/rate-8.jsonl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - if: steps.normal.outcome != 'success' || steps.throttled.outcome != 'success'
        run: exit 1
