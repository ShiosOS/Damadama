name: Safe Supply PR proof
on:
  workflow_call:
permissions:
  contents: read

jobs:
  origin-probe:
    name: origin-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - run: node --test release/supply-origin-probe.test.mjs
      - run: node release/supply-origin-probe.mjs .audit/origin-probe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-origin-probe-${{ github.run_attempt }}
          path: .audit/origin-probe
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  proof-build:
    name: proof-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - run: node --test release/*.test.mjs
      - run: node release/supply-proof.mjs build .audit/proof-build
      - id: paths
        if: always()
        run: node release/supply-proof.mjs upload-paths build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-proof-build-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  proof-scan:
    name: proof-scan
    needs: proof-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: supply-proof-build-${{ github.run_attempt }}
          path: .audit/proof-build
      - run: node release/supply-install.mjs scanner
      - run: node release/supply-proof.mjs scan .audit/proof-build .audit/proof-scan
      - id: paths
        if: always()
        run: node release/supply-proof.mjs upload-paths scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-proof-scan-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  proof-application-scan:
    name: proof-application-scan
    needs: proof-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: supply-proof-build-${{ github.run_attempt }}
          path: .audit/proof-build
      - run: node release/supply-install.mjs scanner
      - run: node release/supply-proof.mjs scan-application .audit/proof-build .audit/proof-application
      - id: paths
        if: always()
        run: node release/supply-proof.mjs upload-paths application-scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: supply-proof-application-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.paths }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  supply-pr:
    needs: [origin-probe, proof-build, proof-scan, proof-application-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node .github/ci/required-jobs.mjs supply-pr
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
