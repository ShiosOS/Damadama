name: Request error observation

on:
  pull_request:
    paths:
      - "ops/diagnostics/**"
      - "server/**"
      - "tests/Backend/**"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/ops-request-errors.yml"
  push:
    paths:
      - "ops/diagnostics/**"
      - "server/**"
      - "tests/Backend/**"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/ops-request-errors.yml"
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309
        with:
          dotnet-version: "10.0.112"
      - run: node ops/diagnostics/receiver-verify.mjs

  staging:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: staging-request-error-observation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Observe the bounded staging request error window
        run: node ops/diagnostics/receiver-cli.mjs
        env:
          REQUEST_ERRORS_ENVIRONMENT: staging
          REQUEST_ERRORS_ENABLED_STAGING: ${{ vars.REQUEST_ERRORS_ENABLED_STAGING }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_LOG_READER_TOKEN_STAGING: ${{ secrets.RAILWAY_LOG_READER_TOKEN_STAGING }}
