name: Security fixtures

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: security-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Exercise the native Bun audit policy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawn } from 'node:child_process';
          import { createServer } from 'node:http';
          import { mkdtemp, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { gunzipSync } from 'node:zlib';

          const scenarios = [
            { name: 'clean', severity: null, scope: 'runtime', code: 0, message: 'No vulnerabilities found' },
            { name: 'below threshold', severity: 'low', scope: 'runtime', code: 0, message: '' },
            { name: 'high runtime', severity: 'high', scope: 'runtime', code: 1, message: 'high: Fixture advisory' },
            { name: 'high development', severity: 'high', scope: 'development', code: 1, message: 'high: Fixture advisory' },
            { name: 'critical', severity: 'critical', scope: 'runtime', code: 1, message: 'critical: Fixture advisory' },
            { name: 'registry error', severity: 'error', scope: 'runtime', code: 1, message: 'audit request failed (status 503)' },
          ];

          for (const scenario of scenarios) {
            const fixture = await mkdtemp(join(tmpdir(), 'security-bun-'));
            const requests = [];
            const server = createServer(async (request, response) => {
              const chunks = [];
              for await (const chunk of request) chunks.push(chunk);
              const body = Buffer.concat(chunks);
              requests.push({
                method: request.method,
                path: request.url,
                payload: JSON.parse(request.headers['content-encoding'] === 'gzip' ? gunzipSync(body) : body),
              });
              response.setHeader('content-type', 'application/json');
              if (scenario.severity === 'error') {
                response.statusCode = 503;
                response.end('{"error":"fixture registry unavailable"}');
                return;
              }
              const advisory = {
                id: 12345,
                url: 'https://example.test/advisory/12345',
                title: 'Fixture advisory',
                severity: scenario.severity,
                vulnerable_versions: '<=1.0.0',
                cwe: ['CWE-79'],
              };
              response.end(scenario.severity ? JSON.stringify({ 'fixture-package': [advisory] }) : '{}');
            });

            try {
              server.listen(0, '127.0.0.1');
              await new Promise(resolve => server.once('listening', resolve));
              const manifest = { name: 'security-fixture', version: '1.0.0' };
              const workspace = { name: 'security-fixture' };
              manifest[scenario.scope === 'development' ? 'devDependencies' : 'dependencies'] = { 'fixture-package': '1.0.0' };
              workspace[scenario.scope === 'development' ? 'devDependencies' : 'dependencies'] = { 'fixture-package': '1.0.0' };
              await writeFile(join(fixture, 'package.json'), JSON.stringify(manifest));
              await writeFile(join(fixture, 'bun.lock'), JSON.stringify({
                lockfileVersion: 1,
                configVersion: 1,
                workspaces: { '': workspace },
                packages: { 'fixture-package': ['fixture-package@1.0.0', '', {}, 'sha512-test'] },
              }));
              const port = server.address().port;
              const child = spawn('bun', ['audit', '--audit-level', 'high'], {
                cwd: fixture,
                env: { ...process.env, BUN_CONFIG_REGISTRY: `http://127.0.0.1:${port}/` },
              });
              let output = '';
              child.stdout.on('data', chunk => output += chunk);
              child.stderr.on('data', chunk => output += chunk);
              const code = await new Promise((resolve, reject) => {
                child.once('error', reject);
                child.once('close', resolve);
              });
              assert.equal(code, scenario.code, `${scenario.name}: unexpected exit ${code}\n${output}`);
              assert.equal(requests.length, 1, `${scenario.name}: expected one native advisory request`);
              assert.equal(requests[0].method, 'POST');
              assert.equal(requests[0].path, '/-/npm/v1/security/advisories/bulk');
              assert.deepEqual(requests[0].payload, { 'fixture-package': ['1.0.0'] });
              assert.ok(output.includes(scenario.message), `${scenario.name}: missing diagnostic\n${output}`);
              if (scenario.severity === 'high' || scenario.severity === 'critical') {
                assert.ok(output.includes('fixture-package') && output.includes('https://example.test/advisory/12345'));
              }
              console.log(`${scenario.name}: exit ${code}, native request and diagnostic verified`);
            } finally {
              server.close();
              await rm(fixture, { recursive: true, force: true });
            }
          }
          NODE

  codeql:
    name: security-fixtures-codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, actions]
    permissions:
      contents: read
    env:
      # Generated examples are outside the pull request diff.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    steps:
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Create nonexecuted safe and unsafe examples
        env:
          LANGUAGE: ${{ matrix.language }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const root = process.env.GITHUB_WORKSPACE;
          const write = async (file, content) => {
            const path = join(root, file);
            await mkdir(join(path, '..'), { recursive: true });
            await writeFile(path, content);
          };
          if (process.env.LANGUAGE === 'csharp') {
            await write('Fixture.csproj', '<Project Sdk="Microsoft.NET.Sdk.Web"><PropertyGroup><TargetFramework>net10.0</TargetFramework><OutputType>Library</OutputType></PropertyGroup></Project>');
            await write('Bad.cs', `using System.IO;
          using Microsoft.AspNetCore.Builder;
          using Microsoft.AspNetCore.Http;
          using Microsoft.AspNetCore.Routing;
          public static class Bad {
            public static void Map(IEndpointRouteBuilder routes) {
              routes.MapGet("/bad", (HttpRequest request) => File.ReadAllText(request.Query["path"].ToString()));
            }
          }`);
            await write('Safe.cs', `using System.IO;
          using Microsoft.AspNetCore.Builder;
          using Microsoft.AspNetCore.Routing;
          public static class Safe {
            public static void Map(IEndpointRouteBuilder routes) {
              routes.MapGet("/safe", () => File.ReadAllText("known-file.txt"));
            }
          }`);
          } else if (process.env.LANGUAGE === 'javascript-typescript') {
            await write('Bad.js', `const app = require('express')();
          app.get('/bad/:id', (req, res) => res.send('Unknown user: ' + req.params.id));`);
            await write('Safe.js', `const app = require('express')();
          app.get('/safe/:id', (_req, res) => res.send('Unknown user'));`);
          } else {
            const commentBody = '$' + '{{ github.event.comment.body }}';
            await write('.github/workflows/Bad.yml', `name: Unsafe example
          on: issue_comment
          jobs:
            example:
              runs-on: ubuntu-latest
              steps:
                - run: echo '${commentBody}'
          `);
            await write('.github/workflows/Safe.yml', `name: Safe example
          on: issue_comment
          jobs:
            example:
              runs-on: ubuntu-latest
              steps:
                - env:
                    BODY: ${commentBody}
                  run: echo "$BODY"
          `);
          }
          NODE
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}
          db-location: ${{ runner.temp }}/fixture-codeql-db
      - if: matrix.language == 'csharp'
        run: dotnet build Fixture.csproj
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          output: ${{ runner.temp }}/fixture-codeql-sarif
          upload: never
          upload-database: false
      - name: Assert native CodeQL findings
        env:
          LANGUAGE: ${{ matrix.language }}
          SARIF_DIR: ${{ runner.temp }}/fixture-codeql-sarif
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const expected = {
            csharp: 'cs/path-injection',
            'javascript-typescript': 'js/reflected-xss',
            actions: 'actions/code-injection/critical',
          }[process.env.LANGUAGE];
          const files = (await readdir(process.env.SARIF_DIR)).filter(file => file.endsWith('.sarif'));
          assert.ok(files.length > 0, 'CodeQL produced no SARIF file');
          const findings = [];
          for (const file of files) {
            const sarif = JSON.parse(await readFile(join(process.env.SARIF_DIR, file), 'utf8'));
            for (const run of sarif.runs ?? []) {
              for (const result of run.results ?? []) {
                const locations = (result.locations ?? []).map(location => location.physicalLocation?.artifactLocation?.uri ?? '');
                findings.push({ ruleId: result.ruleId, locations });
              }
            }
          }
          assert.ok(findings.some(finding => finding.ruleId === expected && finding.locations.some(uri => /Bad\.(cs|js|yml)$/.test(uri))), `${expected}: missing unsafe example finding: ${JSON.stringify(findings)}`);
          assert.ok(!findings.some(finding => finding.ruleId === expected && finding.locations.some(uri => /Safe\.(cs|js|yml)$/.test(uri))), `${expected}: safe example was flagged: ${JSON.stringify(findings)}`);
          console.log(`${expected}: unsafe example found, safe example clear`);
          NODE

  dependency-review:
    name: security-fixtures-dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: actions/dependency-review-action
          ref: a1d282b36b6f3519aa1f3fc636f609c47dddb294
          path: fixture-dependency-action
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Exercise the pinned native dependency review action
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawn } from 'node:child_process';
          import { createServer } from 'node:http';
          import { mkdtemp, readFile, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';

          const scenarios = [
            { name: 'clean', severity: null, scope: 'runtime', code: 0 },
            { name: 'moderate', severity: 'moderate', scope: 'runtime', code: 0 },
            { name: 'high runtime', severity: 'high', scope: 'runtime', code: 1 },
            { name: 'high development', severity: 'high', scope: 'development', code: 1 },
            { name: 'high unknown', severity: 'high', scope: 'unknown', code: 1 },
            { name: 'critical', severity: 'critical', scope: 'runtime', code: 1 },
          ];

          for (const scenario of scenarios) {
            const directory = await mkdtemp(join(tmpdir(), 'security-dependency-'));
            const requests = [];
            const server = createServer((request, response) => {
              requests.push(request.url);
              response.setHeader('content-type', 'application/json');
              response.end(JSON.stringify([{
                change_type: 'added',
                manifest: 'package-lock.json',
                ecosystem: 'npm',
                name: 'fixture-package',
                version: '1.0.0',
                package_url: 'pkg:npm/fixture-package@1.0.0',
                license: 'MIT',
                source_repository_url: null,
                scope: scenario.scope,
                vulnerabilities: scenario.severity ? [{
                  severity: scenario.severity,
                  advisory_ghsa_id: 'GHSA-abcd-1234-5678',
                  advisory_summary: 'Fixture advisory',
                  advisory_url: 'https://example.test/GHSA-abcd-1234-5678',
                }] : [],
              }]));
            });
            try {
              server.listen(0, '127.0.0.1');
              await new Promise(resolve => server.once('listening', resolve));
              const port = server.address().port;
              const outputPath = join(directory, 'output');
              const summaryPath = join(directory, 'summary');
              await writeFile(outputPath, '');
              await writeFile(summaryPath, '');
              const env = {
                ...process.env,
                GITHUB_API_URL: `http://127.0.0.1:${port}`,
                GITHUB_REPOSITORY: 'ShiosOS/Damadama',
                GITHUB_EVENT_NAME: 'workflow_dispatch',
                GITHUB_SERVER_URL: 'https://github.com',
                GITHUB_OUTPUT: outputPath,
                GITHUB_STEP_SUMMARY: summaryPath,
                'INPUT_REPO-TOKEN': 'fixture-token',
                'INPUT_BASE-REF': 'base',
                'INPUT_HEAD-REF': 'head',
                'INPUT_FAIL-ON-SEVERITY': 'high',
                'INPUT_FAIL-ON-SCOPES': 'runtime, development, unknown',
                'INPUT_SHOW-OPENSSF-SCORECARD': 'false',
                'INPUT_LICENSE-CHECK': 'false',
                'INPUT_COMMENT-SUMMARY-IN-PR': 'never',
              };
              const child = spawn(process.execPath, [join(process.env.GITHUB_WORKSPACE, 'fixture-dependency-action/dist/index.js')], { env });
              let output = '';
              child.stdout.on('data', chunk => output += chunk);
              child.stderr.on('data', chunk => output += chunk);
              const code = await new Promise((resolve, reject) => { child.once('error', reject); child.once('close', resolve); });
              assert.equal(code, scenario.code, `${scenario.name}: exit ${code}\n${output}`);
              assert.equal(requests.length, 1, `${scenario.name}: ${requests.join(', ')}`);
              assert.ok(requests[0].includes('/dependency-graph/compare/base...head'));
              if (scenario.code === 1) {
                assert.ok(output.includes('fixture-package@1.0.0') && output.includes('Fixture advisory'), output);
              } else {
                assert.ok(output.includes('did not detect any vulnerable packages'), output);
              }
              console.log(`${scenario.name}: exit ${code}; native dependency review request and diagnostic verified`);
            } finally {
              server.close();
              await rm(directory, { recursive: true, force: true });
            }
          }
          NODE
