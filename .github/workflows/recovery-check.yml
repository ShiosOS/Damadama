name: Recovery checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: docker build --platform linux/amd64 --file ops/recovery/Dockerfile --tag damadama-recovery-proof .
      - run: node ops/recovery/prove.mjs > recovery-check.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: recovery-failure
          path: |
            recovery-check.log
            .audit/recovery-proof-*/result.json
            !**/*token*
            !**/.env*
            !**/storage-state*.json
            !**/.auth/**
          include-hidden-files: true
          retention-days: 3
