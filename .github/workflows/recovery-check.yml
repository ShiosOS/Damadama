name: Recovery checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: recovery-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: docker build --platform linux/amd64 --file ops/recovery/Dockerfile --tag damadama-recovery-proof .
      - run: node ops/recovery/prove.mjs > recovery-check.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: recovery-failure
          path: |
            recovery-check.log
            .audit/recovery-proof-*/result.json
          retention-days: 3
